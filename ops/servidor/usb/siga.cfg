#### La instalación de la máquina de SIGA, sin preguntas.
#
# Lo arma hacer-el-usb.sh dentro del ISO de Debian 13. Se usa SOLO desde la
# entrada «Instalar SIGA - BORRA EL DISCO» del menú, que no viene marcada.
#
#   el disco      el interno más grande; nunca el pendrive (elegir-disco.sh)
#   la red        DHCP por el cable del Dahua
#   la cuenta     `daniel`, con la llave de la Mac; sin root, con sudo
#   el SSH        solo con llave: la clave de `daniel` es para la consola, nada más
#
# `@CLAVE@` lo cambia hacer-el-usb.sh por el resumen de una clave al azar; la
# clave en limpio queda en references/, que no se sube.

### Idioma, país y teclado
d-i debian-installer/locale string es_VE.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string VE
d-i localechooser/supported-locales multiselect es_VE.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select latam

### Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string siga-casa
d-i netcfg/get_domain string
d-i netcfg/hostname string siga-casa
d-i hw-detect/load_firmware boolean true

### De dónde baja los paquetes
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true

### Cuentas
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Daniel
d-i passwd/username string daniel
d-i passwd/user-password-crypted password @CLAVE@

### Reloj
d-i clock-setup/utc boolean true
d-i time/zone string America/Caracas
d-i clock-setup/ntp boolean true

### El disco
# ⚠️ elegir-disco.sh descarta el medio de instalación, todo lo que cuelga de un
# USB y lo removible, y se queda con el más grande que sobre. Un pendrive que
# se anuncia como disco fijo existe, y uno más grande que el disco viejo
# ganaría la cuenta si solo se mirara el tamaño.
d-i partman/early_command string sh /cdrom/preseed/elegir-disco.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Paquetes
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates avahi-daemon
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### El arranque (el disco lo puso elegir-disco.sh)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

### Al terminar
# La llave de la Mac, sudo sin clave (lo pide el montaje desatendido), SSH solo
# con llave, y una ficha del hardware para leer antes de confiarle nada.
d-i preseed/late_command string sh /cdrom/preseed/al-terminar.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
