# Integración continua.
#
# No define QUÉ se verifica: eso vive en `config/ci.rb` y se corre igual con
# `bin/ci` en cualquier máquina. Acá solo se arma el entorno para que ese mismo
# pipeline pueda correr.
#
# Un CI que verifica cosas distintas de las que uno puede correr en su máquina se
# convierte en un oráculo: falla y hay que adivinar por qué.
#
# Ver MOR-105.
name: CI

# ## Cuándo corre, y cuándo NO
#
# Una corrida son unos quince minutos de una máquina de GitHub, y el repositorio
# es privado: los minutos se pagan. Tres reglas para no gastarlos dos veces:
#
#     push          solo a `main`. Una rama corre por su PR, que es el mismo
#                   código: con `branches: ["**"]` cada push a una rama con PR
#                   disparaba DOS corridas idénticas, una por cada evento.
#     paths-ignore  lo que no toca el producto ni lo lee ningún test no corre.
#     concurrency   un commit nuevo en un PR cancela la corrida del anterior,
#                   que ya no le importa a nadie.
#
# ⚠️ Una rama SIN PR abierto ya no corre al subirla. Es a propósito —«una
# funcionalidad, una rama, un PR»— y `bin/ci` corre lo mismo en la máquina.
#
# ⚠️ `paths-ignore` mira TODO lo que cambia el PR, no el último commit: sumarle
# un commit de `ESTADO.md` a un PR con código lo vuelve a correr entero. Para
# ese caso está `[skip ci]` en el mensaje del commit, que GitHub respeta solo.
#
# ⚠️ Y lo respeta esté donde esté en el mensaje. El commit que agregó estas
# reglas las explicaba con el marcador escrito tal cual, y no corrió: un PR
# «sin chequeos» y ningún error. Si un PR no arranca, lo primero es leer el
# mensaje de su último commit.
#
# ⚠️ Lo que NO está en la lista, y por qué: `CHANGELOG.md` lo lee
# `version_test`, y `docs/manual/` es lo que sirve `/manual` — eso es producto.
on:
  push:
    branches: [main]
    paths-ignore:
      - "BACKLOG.md"
      - "CLAUDE.md"
      - "DESPLIEGUE.md"
      - "ESTADO.md"
      - "README.md"
      - "docs/cards/**"
      - "docs/investigacion/**"
      - "docs/specs/**"
      - "docs/tareas-de-operacion.md"
  pull_request:
    paths-ignore:
      - "BACKLOG.md"
      - "CLAUDE.md"
      - "DESPLIEGUE.md"
      - "ESTADO.md"
      - "README.md"
      - "docs/cards/**"
      - "docs/investigacion/**"
      - "docs/specs/**"
      - "docs/tareas-de-operacion.md"

# ⚠️ El grupo de `main` es su propio commit, así que ahí no se cancela ni se
# encola nada: cada mezcla se verifica entera. Con un grupo fijo para `main`,
# tres mezclas seguidas dejaban la del medio cancelada sin haber corrido.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Suite, seeds y humo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Postgres corre en otro contenedor: la conexión va por TCP y con clave, no
      # por socket local como en una máquina de desarrollo.
      SIGA_DB_HOST: localhost
      SIGA_DB_PASSWORD: postgres
      SIGA_APP_PASSWORD: siga_app_ci

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # ⚠️ `libvips` no es opcional: es con lo que se encoge el comprobante de un
      # pago y el escudo de la lista de alumnos, y sus tests la usan de verdad.
      # Sin ella `ruby-vips` levanta `LoadError: Could not open library
      # 'vips.so.42'` y la suite queda en rojo por el entorno, no por el código —
      # que es como estuvo desde que existe `EncogeElVoucher`.
      #
      # Se pide por `libvips-tools`, que arrastra la biblioteca con el nombre
      # que tenga en esa versión de Ubuntu: `libvips42` hasta la 22.04,
      # `libvips42t64` desde la 24.04. El `Dockerfile` la nombra directo porque
      # ahí la imagen base está fija.
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev libvips-tools

      # ⚠️ Este paso y el siguiente son el motivo por el que el CI de este
      # proyecto no es el genérico de Rails.
      #
      # La app se conecta como `siga_app`, un rol SIN superusuario ni BYPASSRLS,
      # porque con cualquiera de los dos PostgreSQL se salta las políticas de RLS
      # antes de mirarlas (MOR-87). Pero ese rol no puede crear la base en la que
      # va a vivir: eso lo hace `postgres`, y después se le traspasa todo.
      #
      # Correr el CI como `postgres` sería más simple y dejaría el aislamiento sin
      # verificar en el único lugar donde se verifica automáticamente.
      #
      # ⚠️ `db:create db:schema:load` y NO `db:prepare`. Parecen lo mismo y no lo
      # son: `db:prepare`, cuando la base es nueva, además la SIEMBRA. Eran tres
      # minutos sembrando como superusuario unos datos que el paso de más abajo
      # borra y vuelve a sembrar con el rol de verdad — el 15 % de la corrida,
      # tirado, y sin que ningún paso lo dijera: el registro lo mostraba bajo el
      # título «Crear la base».
      - name: Crear la base con el usuario privilegiado
        env:
          SIGA_DB_USER: postgres
          SIGA_DB_PASSWORD: postgres
        run: bin/rails db:create db:schema:load

      # Dos veces, una por base. Cargar el esquema en desarrollo lo carga también
      # en `siga_test`, y `rls:crear_rol` solo traspasa las tablas de la base a la
      # que está conectado. Sin la segunda corrida, `bin/rails test` muere con
      # `permission denied for table ar_internal_metadata`.
      - name: Crear el rol sin privilegios y traspasarle todo
        env:
          SIGA_DB_USER: postgres
          SIGA_DB_PASSWORD: postgres
        run: |
          bin/rails rls:crear_rol
          RAILS_ENV=test bin/rails rls:crear_rol

      # `bin/smoke` recorre la app por HTTP contra la base de DESARROLLO, así que
      # necesita sus datos. Los seeds además son los casos de QA de MOR-93.
      #
      # ⚠️ Sembrar deja dos trabajos en la cola —el análisis de cada escudo que
      # se adjunta— y acá no corre ningún worker. Cuando `bin/ci` llega al humo
      # llevan doce minutos esperando, que es justo lo que `/salud` existe para
      # delatar: el CI estuvo en rojo por eso. No se arregla acá, vaciando la
      # cola a mano: el humo levanta su propio worker, y por eso corre igual en
      # una máquina que en GitHub.
      # `SIEMBRA_REDUCIDA`: siete alumnos por sección. El humo recorre las
      # pantallas, no cuenta alumnos, y la siembra entera tarda tres minutos.
      - name: Sembrar los datos de desarrollo
        env:
          SIGA_DB_PASSWORD: siga_app_ci
          SIEMBRA_REDUCIDA: "1"
        run: bin/rails db:seed:replant

      - name: bin/ci
        env:
          SIGA_DB_PASSWORD: siga_app_ci
        run: bin/ci

      # El log del server del smoke es lo que explica un fallo de vista: sin esto
      # hay que adivinar qué pasó dentro de una petición que devolvió 500.
      #
      # ⚠️ Y las CAPTURAS de los tests de sistema que fallaron, que Rails deja en
      # `tmp/screenshots`. Un test intermitente falló dos veces acá con «no
      # encontré la fila» y el log solo decía que el formulario nunca llegó; lo
      # que lo explicó fue la captura, sacada al reproducirlo en una máquina: el
      # campo vacío y el cursor parpadeando adentro.
      - name: Guardar los logs y las capturas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            log/
            tmp/screenshots/
          retention-days: 7
