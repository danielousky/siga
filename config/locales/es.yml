# Nombres de modelo y atributo en español.
#
# Los mensajes de error genéricos ("ya está en uso", "debe existir") los aporta
# la gema rails-i18n. Lo que va acá es cómo se llama cada cosa en el dominio,
# para que un error diga "Sección pertenece a otro colegio" y no "Section …".
#
# Rails busca el nombre de un atributo en este orden:
#   1. activerecord.attributes.<modelo>.<atributo>
#   2. attributes.<atributo>              ← el bloque de abajo de todo
#   3. el nombre humanizado en inglés
#
# Por eso los atributos que significan lo mismo en varios modelos (section,
# subject, school…) van una sola vez en el fallback global, y arriba solo queda
# lo que es específico de un modelo.
es:

  # Los rótulos de los botones de formulario.
  #
  # Sin esto, Rails compone "Crear %{model}" / "Actualizar %{model}" con el
  # nombre del modelo, que va con mayúscula porque es un sustantivo suelto
  # ("Materia", "Período académico"). El resultado eran botones en Title Case
  # —"Actualizar Materia"— justo después de haber barrido el Title Case de
  # todas las vistas.
  #
  # "Guardar cambios" además dice mejor lo que hace: la pantalla ya se titula
  # "Editar materia", así que repetir el sustantivo en el botón es ruido.
  helpers:
    submit:
      create: "Crear"
      update: "Guardar cambios"
      submit: "Guardar"
  activerecord:
    errors:
      messages:
        # La usa el concern ValidatesSameSchool. Queda genérica a propósito: el
        # nombre del atributo ya dice cuál de las dos partes no coincide, y Rails
        # lo antepone solo ("Sección pertenece a otro colegio").
        different_school: pertenece a otro colegio

        # `dependent: :restrict_with_error`. El mensaje por defecto de Rails
        # ("Cannot delete record because dependent activity grades exist") además
        # de estar en inglés no dice qué hacer.
        restrict_dependent_destroy:
          has_one: "no se puede eliminar: tiene %{record} asociado"
          has_many: "no se puede eliminar mientras tenga %{record} cargadas"

    models:
      school:
        one: Colegio
        other: Colegios
      grade:
        one: Grado
        other: Grados
      academic_period:
        one: Período académico
        other: Períodos académicos
      evaluation_moment:
        one: Momento de evaluación
        other: Momentos de evaluación
      subject:
        one: Materia
        other: Materias
      student:
        one: Alumno
        other: Alumnos
      teacher:
        one: Profesor
        other: Profesores
      department:
        one: Departamento
        other: Departamentos
      section:
        one: Sección
        other: Secciones
      enrollment:
        one: Inscripción
        other: Inscripciones
      teacher_section:
        one: Asignación de profesor
        other: Asignaciones de profesor
      evaluation_activity:
        one: Actividad evaluativa
        other: Actividades evaluativas
      activity_grade:
        one: Nota de actividad
        other: Notas de actividad
      moment_grade:
        one: Nota del lapso
        other: Notas del lapso
      final_grade_book:
        one: Nota final
        other: Notas finales

    attributes:
      # ⚠️ La identidad de una persona faltaba ENTERA, y no era cosmético: las
      # vistas escribían el rótulo a mano, así que se veía bien — pero los
      # mensajes de error salían del `human_attribute_name` sin traducir y una
      # secretaria leía **«First name no puede estar en blanco»**.
      #
      # Los valores son los que las vistas ya escribían, a propósito: centralizar
      # no es momento de cambiar lo que la gente lee.
      user:
        first_name: Nombres
        last_name: Primer apellido
        second_last_name: Segundo apellido
        document: Cédula de identidad
        document_type: Tipo de documento
        cedula_escolar: Cédula escolar
        birth_date: Fecha de nacimiento
        sex: Sexo
        email: Correo electrónico
        phone: Teléfono
        address: Dirección
        password: Contraseña
        password_confirmation: Repita la contraseña
      admin:
        role: Rol
      school:
        name: Nombre del colegio
        firma: Firma del director, escaneada
        sello: Sello del colegio, escaneado
        dea_code: Código DEA
        location: Ubicación
        school_type: Tipo de institución
        logo: Logotipo
      grade:
        level: Nivel
        escala: Escala de calificación
      academic_period:
        start_date: Fecha de inicio
        end_date: Fecha de cierre
      evaluation_moment:
        weight: Peso
        starts_on: Comienza el
        ends_on: Termina el
      student:
        school_card: Carnet
      evaluation_activity:
        description: Descripción
        weight_percentage: Ponderación
        date_scheduled: Fecha prevista
        evaluation_moment: Lapso
      activity_grade:
        score: Nota
      moment_grade:
        final_moment_score: Nota del lapso
      final_grade_book:
        annual_average: Promedio anual
        remedial_exam_score: Nota de reparación
        final_score: Nota definitiva
        comments: Observaciones
      enrollment:
        enrollment_date: Fecha de inscripción
        status: Estado

  # Fallback global: atributos que significan lo mismo en todos los modelos.
  # Va DENTRO de `es:` y FUERA de `activerecord:` — Rails lo busca como
  # `es.attributes.<atributo>` cuando no encuentra el del modelo. Si se escribe
  # al nivel del documento, YAML lo interpreta como otro idioma y no se aplica.
  attributes:
    school: Colegio
    grade: Grado
    section: Sección
    subject: Materia
    student: Alumno
    teacher: Profesor
    department: Departamento
    enrollment: Inscripción
    academic_period: Período académico
    evaluation_moment: Momento de evaluación
    evaluation_activity: Actividad evaluativa
    leader_teacher: Profesor guía
    coordinator_teacher: Coordinador del grado
    user: Usuario
    name: Nombre
    code: Código
    capacity: Capacidad
    classroom: Aula

    # Las validaciones que corren sobre la clave foránea (uniqueness con scope,
    # sobre todo) reportan el error en `<algo>_id`, no en la asociación. Rails no
    # los mapea solo, así que van explícitos.
    school_id: Colegio
    grade_id: Grado
    section_id: Sección
    subject_id: Materia
    student_id: Alumno
    teacher_id: Profesor
    department_id: Departamento
    enrollment_id: Inscripción
    academic_period_id: Período académico
    evaluation_moment_id: Momento de evaluación
    evaluation_activity_id: Actividad evaluativa
    leader_teacher_id: Profesor guía
    coordinator_teacher_id: Coordinador del grado
