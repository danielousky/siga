# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Los archivos de las importaciones traen datos de menores y no viven para
  # siempre. La FILA se conserva —es la bitácora—; lo que se borra es el
  # adjunto. Ver `PurgarPlanillasJob`.
  #
  # De madrugada porque toca disco y no hay apuro: nadie espera este resultado.
  purgar_planillas_de_importacion:
    class: PurgarPlanillasJob
    schedule: at 3am every day

<% if ENV["SIGA_MUESTRA"] == "1" %>
  # ⚠️ SOLO en la instancia de muestra: este trabajo borra la base entera y la
  # vuelve a sembrar (`RestablecerLaMuestraJob`). En el sitio de verdad no se
  # agenda —por eso el `if`—, y si igual corriera, se niega.
  #
  # A las 8 UTC, que son las 4 de la madrugada en Venezuela: la app corre en
  # UTC, y «at 4am» sería medianoche allá, con gente todavía despierta.
  restablecer_la_muestra:
    class: RestablecerLaMuestraJob
    schedule: at 8am every day
<% end %>
