# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On macOS with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# ⚠️ El usuario de esta conexión NO PUEDE ser superusuario ni tener BYPASSRLS.
#
# Un superusuario se salta las políticas de Row-Level Security por completo, y
# `FORCE ROW LEVEL SECURITY` tampoco lo alcanza — FORCE solo somete al DUEÑO de
# la tabla. Con un superusuario el aislamiento de la base parece configurado y
# no se evalúa ni una vez.
#
# En macOS con Postgres de Homebrew el usuario por defecto ES superusuario, así
# que hay que crear el rol de la app explícitamente:
#
#     bin/rails rls:crear_rol
#     bin/rails rls:verificar     # confirma que no se salta el RLS
#
# Ver MOR-87.
# `SIGA_DB_USER` permite entrar con otro rol para las operaciones que el rol de
# la app no puede hacer: crearlo la primera vez y traspasarle las tablas.
#
#     SIGA_DB_USER=$(whoami) bin/rails rls:crear_rol
#
# El día a día —servidor, consola, migraciones— va siempre como `siga_app`.
#
# `SIGA_DB_HOST` y `SIGA_DB_PASSWORD` existen para el CI, donde Postgres corre en
# un contenedor aparte y exige contraseña por TCP. En una máquina de desarrollo
# quedan vacías y la conexión va por socket local, como siempre.
development:
  <<: *default
  database: siga_development
  username: <%= ENV.fetch("SIGA_DB_USER", "siga_app") %>
  host: <%= ENV["SIGA_DB_HOST"] %>
  password: <%= ENV["SIGA_DB_PASSWORD"] %>

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: siga_test
  username: <%= ENV.fetch("SIGA_DB_USER", "siga_app") %>
  host: <%= ENV["SIGA_DB_HOST"] %>
  password: <%= ENV["SIGA_DB_PASSWORD"] %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# ⚠️ El bloque va condicionado, y NO es un capricho.
#
# El comentario de arriba dice que Rails "mergea los valores de DATABASE_URL
# sobre los de este archivo". Es al revés: **las claves escritas acá GANAN sobre
# las de la URL.** Con un `username: siga` escrito, Dokku puede inyectar el
# `DATABASE_URL` correcto y la app se va a conectar igual como `siga` — que en el
# servidor no existe.
#
# Se descubrió corriendo el entorno de producción a mano con `DATABASE_URL`
# puesto: el health check respondía 200 y toda vista que tocara la base daba 500
# con `FATAL: role "siga" does not exist`.
#
# Así que cuando hay `DATABASE_URL` —el caso de Dokku— este archivo no dice nada
# más. Y cuando no la hay, se arma la conexión a mano.
#
# El rol se llama `siga_app` también en producción: un solo nombre en los tres
# entornos, y `bin/rails rls:verificar` comprueba en el arranque del contenedor
# que ese rol no pueda saltarse el RLS.
production:
  <<: *default
<% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
<% else %>
  database: <%= ENV.fetch("SIGA_DB_NAME", "siga_production") %>
  username: <%= ENV.fetch("SIGA_DB_USER", "siga_app") %>
  password: <%= ENV["SIGA_DATABASE_PASSWORD"] %>
  host: <%= ENV["SIGA_DB_HOST"] %>
<% end %>
